# ROKAD backend - local MySQL connection
spring.datasource.url=jdbc:mysql://localhost:3306/rokad_db
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true

server.port=8080

# Shown on the Settings screen and written into every backup file
rokad.version=0.1.0
